<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | JS Motoworks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; background:linear-gradient(135deg,#f8fafc,#e2e8f0); color:#0f172a; }
        .auth-card { width:100%; max-width:480px; border:1px solid #e2e8f0; border-radius:22px; background:white; box-shadow:0 20px 45px rgba(15,23,42,.12); }
        .brand-mark { width:52px; height:52px; border-radius:14px; background:#2563eb; color:white; display:inline-flex; align-items:center; justify-content:center; font-weight:800; }
        .btn-primary { background:#2563eb; border-color:#2563eb; }
    </style>
</head>
<body>
    <div class="auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-mark mb-3">JS</div>
            <h3 class="fw-bold mb-1">Reset password</h3>
            <p class="text-muted mb-0">Customer accounts can reset by email code.</p>
        </div>

        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}

        {% if step == 'reset' %}
        <form method="POST" action="/reset_password">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control form-control-lg" value="{{ email or '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">6-digit Reset Code</label>
                <input type="text" name="reset_code" class="form-control form-control-lg text-center fw-bold" maxlength="6" inputmode="numeric" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">New Password</label>
                <input type="password" name="password" class="form-control form-control-lg" minlength="6" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control form-control-lg" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Update Password</button>
        </form>

        <form method="POST" action="/forgot_password" class="mt-3">
            <input type="hidden" name="email" value="{{ email or '' }}">
            <button class="btn btn-outline-secondary w-100 fw-semibold" type="submit">Resend Reset Code</button>
        </form>
        {% else %}
        <form method="POST" action="/forgot_password">
            <div class="mb-4">
                <label class="form-label fw-semibold">Customer Email Address</label>
                <input type="email" name="email" class="form-control form-control-lg" value="{{ email or '' }}" placeholder="email@example.com" required autofocus>
                <small class="text-muted">We will send a 6-digit reset code to this email.</small>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Send Reset Code</button>
        </form>
        {% endif %}

        <div class="text-center mt-4 small">
            <a href="/login" class="text-muted text-decoration-none">Back to login</a>
            <span class="mx-2 text-muted">|</span>
            <a href="/register" class="text-muted text-decoration-none">Create account</a>
        </div>
    </div>
</body>
</html>
