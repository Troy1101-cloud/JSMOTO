<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JS Motoworks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; background:linear-gradient(135deg,#f8fafc,#e2e8f0); color:#0f172a; }
        .auth-card { width:100%; max-width:440px; border:1px solid #e2e8f0; border-radius:22px; background:white; box-shadow:0 20px 45px rgba(15,23,42,.12); }
        .brand-mark { width:52px; height:52px; border-radius:14px; background:#2563eb; color:white; display:inline-flex; align-items:center; justify-content:center; font-weight:800; }
        .btn-primary { background:#2563eb; border-color:#2563eb; }
    </style>
</head>
<body>
    <div class="auth-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-mark mb-3">JS</div>
            <h3 class="fw-bold mb-1">Sign in</h3>
            <p class="text-muted mb-0">Access your JS Motoworks account.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
            {% if verify_email %}
            <div class="mt-2 small">Please complete the OTP verification after registration before signing in.</div>
            {% endif %}
        </div>
        {% endif %}

        {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username or Email</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="username or email@example.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
            </div>
            <div class="text-end mb-3">
                <a href="/forgot_password" class="small text-decoration-none">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Login</button>
        </form>

        <div class="text-center mt-4 small">
            <span class="text-muted">Customer?</span> <a href="/register" class="fw-semibold text-decoration-none">Create an account</a>
        </div>
    </div>
</body>
</html>
