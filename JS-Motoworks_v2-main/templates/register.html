<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration | JS Motoworks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);}
        .card{max-width:500px;width:100%;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 20px 45px rgba(15,23,42,.12);}
        .btn-primary{background:#2563eb;border-color:#2563eb;}
    </style>
</head>
<body>
<div class="card p-4 p-md-5">
    <h3 class="fw-bold mb-1 text-center">Create Customer Account</h3>
    <p class="text-muted text-center mb-4">Register Customer Account to book appointments and track your service status.</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

    <form method="POST" action="/register">
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="full_name" class="form-control form-control-lg" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control form-control-lg" required>
            <small class="text-muted">A 6-digit OTP verification code will be sent to this email.</small>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control form-control-lg" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Register Customer Account & Send OTP</button>
    </form>

    <div class="text-center mt-3">
        <a href="/login" class="text-muted text-decoration-none">Already have an account? Login</a>
        <span class="mx-2 text-muted">|</span>
        <a href="/verify_customer_email" class="text-muted text-decoration-none">Verify email</a>
    </div>
</div>
</body>
</html>
