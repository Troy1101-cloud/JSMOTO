<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | JS Motoworks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);}
        .card{max-width:500px;width:100%;border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 20px 45px rgba(15,23,42,.12);}
        .btn-primary{background:#2563eb;border-color:#2563eb;}
        .otp-input{font-size:1.5rem;letter-spacing:.45rem;text-align:center;font-weight:800;}
    </style>
</head>
<body>
<div class="card p-4 p-md-5">
    <h3 class="fw-bold mb-1 text-center">Verify Email</h3>
    <p class="text-muted text-center mb-4">Enter the 6-digit OTP code sent to your email.</p>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}

    <form method="POST" action="/verify_customer_email">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control form-control-lg" value="{{ email or '' }}" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">6-Digit OTP Code</label>
            <input type="text" name="otp_code" class="form-control form-control-lg otp-input" inputmode="numeric" maxlength="6" placeholder="000000" required>
        </div>
        <button class="btn btn-primary btn-lg w-100 fw-bold">Verify Account</button>
    </form>

    <form method="POST" action="/resend_customer_otp" class="mt-3">
        <input type="hidden" name="email" value="{{ email or '' }}">
        <button class="btn btn-outline-secondary w-100 fw-bold" type="submit">Resend OTP</button>
    </form>

    <div class="text-center mt-3">
        <a href="/login" class="text-muted text-decoration-none">Back to Login</a>
    </div>
</div>
</body>
</html>
